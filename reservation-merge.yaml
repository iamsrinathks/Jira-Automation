# reservation-merge - merges the reservation-sizer bot PR ONLY inside the CHG window.
# SAMPLE: adapt identifiers, connectors and secrets to your Harness account, and check the
# ServiceNow step fields against your Harness version.
#
# Contract with the reservation-sizer pipeline (see reservation-sizer-chg-steps.yaml):
#   * the bot PR carries the labels `chg-locked` and `chg:<CHG number>`
#   * the CHG description contains the line `head_sha=<PR head SHA>`
#   * the reservations workspace in HCP Terraform is dedicated and has auto-apply ON
#
# Identities (separation of duties - NOT the sizer's GitHub App):
#   * reservation_merger_github_token: contents:write (merge), statuses:write,
#     pull_requests:read, checks:read on the infra repo only
#   * hcp_reservations_token: HCP team token, read runs on the reservations workspace
#   * servicenow_api_user / servicenow_api_password: read change_request
# The delegate needs bash, curl and jq.
pipeline:
  name: reservation-merge
  identifier: reservation_merge
  orgIdentifier: <org>
  projectIdentifier: <project>
  tags:
    component: reservation-sizer
  variables:
    - name: env_name
      type: String
      value: <+input>.default(prd)
    - name: cluster_name
      type: String
      value: <+input>
    - name: github_repo                 # owner/repo
      type: String
      value: <+input>
    - name: github_api
      type: String
      value: <+input>.default(https://api.github.com)
    - name: hcp_workspace_id            # ws-xxxxxxxx (dedicated reservations workspace)
      type: String
      value: <+input>
    - name: hcp_api
      type: String
      value: <+input>.default(https://app.terraform.io/api/v2)
    - name: servicenow_url              # https://<instance>.service-now.com
      type: String
      value: <+input>
  stages:
    - stage:
        name: merge in CHG window
        identifier: merge_in_window
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: find bot PR
                  identifier: find_pr
                  timeout: 5m
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: |
                          set -euo pipefail
                          api="<+pipeline.variables.github_api>"
                          repo="<+pipeline.variables.github_repo>"
                          owner="${repo%%/*}"
                          branch="reservation-sizer/<+pipeline.variables.env_name>-<+pipeline.variables.cluster_name>"
                          gh() { curl -sSf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                                   -H "X-GitHub-Api-Version: 2022-11-28" "$@"; }

                          SKIP=true; PR_NUMBER=""; HEAD_SHA=""; CHG_NUMBER=""; REASON=""
                          pr=$(gh "$api/repos/$repo/pulls?state=open&head=$owner:$branch" | jq -c '.[0] // empty')
                          if [ -z "$pr" ]; then
                            REASON="no open bot PR on $branch"
                          else
                            PR_NUMBER=$(jq -r '.number' <<<"$pr")
                            HEAD_SHA=$(jq -r '.head.sha' <<<"$pr")
                            labels=$(jq -r '.labels[].name' <<<"$pr")
                            CHG_NUMBER=$( (grep -E '^chg:' <<<"$labels" || true) | head -n1 | cut -d: -f2)
                            draft=$(jq -r '.draft' <<<"$pr")
                            reviews=$(gh "$api/repos/$repo/pulls/$PR_NUMBER/reviews?per_page=100")
                            approved=$(jq '[.[] | select(.state=="APPROVED" or .state=="CHANGES_REQUESTED" or .state=="DISMISSED")]
                                           | sort_by(.submitted_at) | group_by(.user.login) | map(last.state)
                                           | (any(.=="APPROVED") and (any(.=="CHANGES_REQUESTED") | not))' <<<"$reviews")
                            guard=$(gh "$api/repos/$repo/commits/$HEAD_SHA/check-runs?check_name=reservation-sizer-guard" \
                                      | jq -r '.check_runs[0].conclusion // "missing"')
                            if [ "$draft" = "true" ]; then REASON="PR #$PR_NUMBER is a draft (dry-run)"
                            elif ! grep -qx 'chg-locked' <<<"$labels"; then REASON="PR #$PR_NUMBER has no chg-locked label"
                            elif [ -z "$CHG_NUMBER" ]; then REASON="PR #$PR_NUMBER has no chg:<number> label"
                            elif [ "$approved" != "true" ]; then REASON="PR #$PR_NUMBER is not approved (or changes requested)"
                            elif [ "$guard" != "success" ]; then REASON="reservation-sizer-guard is '$guard' on $HEAD_SHA"
                            else SKIP=false; REASON="PR #$PR_NUMBER ready: CHG $CHG_NUMBER, head $HEAD_SHA"
                            fi
                          fi
                          echo "$REASON"
                    environmentVariables:
                      - name: GH_TOKEN
                        type: Secret
                        value: reservation_merger_github_token
                    outputVariables:
                      - name: SKIP
                        type: String
                        value: SKIP
                      - name: PR_NUMBER
                        type: String
                        value: PR_NUMBER
                      - name: HEAD_SHA
                        type: String
                        value: HEAD_SHA
                      - name: CHG_NUMBER
                        type: String
                        value: CHG_NUMBER
                      - name: REASON
                        type: String
                        value: REASON

              - step:
                  type: ShellScript
                  name: CHG records this exact PR
                  identifier: verify_sha
                  timeout: 5m
                  when:
                    stageStatus: Success
                    condition: <+execution.steps.find_pr.output.outputVariables.SKIP> == "false"
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: |
                          set -euo pipefail
                          chg="<+execution.steps.find_pr.output.outputVariables.CHG_NUMBER>"
                          sha="<+execution.steps.find_pr.output.outputVariables.HEAD_SHA>"
                          desc=$(curl -sSf -u "$SN_USER:$SN_PASS" -H "Accept: application/json" \
                                   "<+pipeline.variables.servicenow_url>/api/now/table/change_request?sysparm_query=number=$chg&sysparm_fields=number,description&sysparm_limit=1" \
                                 | jq -r '.result[0].description // ""')
                          if ! grep -q "head_sha=$sha" <<<"$desc"; then
                            echo "CHG $chg does not record head_sha=$sha - the PR changed after the CHG was raised. Not merging."
                            exit 1
                          fi
                          echo "CHG $chg matches PR head $sha"
                    environmentVariables:
                      - name: SN_USER
                        type: Secret
                        value: servicenow_api_user
                      - name: SN_PASS
                        type: Secret
                        value: servicenow_api_password

              - step:
                  type: ServiceNowApproval
                  name: CHG approved and window open
                  identifier: chg_approved
                  timeout: 10m
                  when:
                    stageStatus: Success
                    condition: <+execution.steps.find_pr.output.outputVariables.SKIP> == "false"
                  spec:
                    connectorRef: <servicenow_connector>
                    ticketType: change_request
                    ticketNumber: <+execution.steps.find_pr.output.outputVariables.CHG_NUMBER>
                    retryInterval: 1m
                    approvalCriteria:
                      type: KeyValues
                      spec:
                        matchAnyCondition: false
                        conditions:
                          - key: state
                            operator: in
                            value: Scheduled,Implement      # your CHG state labels
                    rejectionCriteria:
                      type: KeyValues
                      spec:
                        matchAnyCondition: true
                        conditions:
                          - key: state
                            operator: in
                            value: Canceled,Closed
                    changeWindow:                           # approval only counts inside the CHG's planned window
                      startField: start_date
                      endField: end_date

              - step:
                  type: ShellScript
                  name: merge at the approved SHA
                  identifier: merge
                  timeout: 5m
                  when:
                    stageStatus: Success
                    condition: <+execution.steps.find_pr.output.outputVariables.SKIP> == "false"
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: |
                          set -euo pipefail
                          api="<+pipeline.variables.github_api>"
                          repo="<+pipeline.variables.github_repo>"
                          pr="<+execution.steps.find_pr.output.outputVariables.PR_NUMBER>"
                          sha="<+execution.steps.find_pr.output.outputVariables.HEAD_SHA>"
                          chg="<+execution.steps.find_pr.output.outputVariables.CHG_NUMBER>"
                          gh() { curl -sSf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                                   -H "X-GitHub-Api-Version: 2022-11-28" "$@"; }
                          # the required check that blocks any daytime merge of a bot PR
                          gh -X POST "$api/repos/$repo/statuses/$sha" \
                            -d "{\"state\":\"success\",\"context\":\"change-window\",\"description\":\"$chg window open - merged by Harness\"}" >/dev/null
                          sleep 10
                          MERGED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                          # GitHub refuses (409) if the head moved since the CHG was approved
                          MERGE_SHA=$(gh -X PUT "$api/repos/$repo/pulls/$pr/merge" \
                            -d "{\"sha\":\"$sha\",\"merge_method\":\"squash\",\"commit_title\":\"reservation-sizer: $chg (#$pr)\"}" \
                            | jq -r '.sha')
                          echo "merged PR #$pr as $MERGE_SHA at $MERGED_AT"
                    environmentVariables:
                      - name: GH_TOKEN
                        type: Secret
                        value: reservation_merger_github_token
                    outputVariables:
                      - name: MERGE_SHA
                        type: String
                        value: MERGE_SHA
                      - name: MERGED_AT
                        type: String
                        value: MERGED_AT

              - step:
                  type: ShellScript
                  name: wait for the HCP Terraform apply
                  identifier: wait_hcp
                  timeout: 75m
                  when:
                    stageStatus: Success
                    condition: <+execution.steps.find_pr.output.outputVariables.SKIP> == "false"
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: |
                          set -euo pipefail
                          hcp() { curl -sSf -H "Authorization: Bearer $HCP_TOKEN" -H "Content-Type: application/vnd.api+json" "$@"; }
                          ws="<+pipeline.variables.hcp_workspace_id>"
                          since="<+execution.steps.merge.output.outputVariables.MERGED_AT>"
                          deadline=$(( $(date +%s) + 3600 ))
                          HCP_RUN=""; HCP_STATUS="not-started"
                          while [ "$(date +%s)" -lt "$deadline" ]; do
                            # the oldest run created after the merge = the run the merge triggered
                            run=$(hcp "<+pipeline.variables.hcp_api>/workspaces/$ws/runs?page%5Bsize%5D=10" \
                                  | jq -c --arg t "$since" '[.data[] | select(.attributes["created-at"] >= $t)] | last // empty')
                            if [ -n "$run" ]; then
                              HCP_RUN=$(jq -r '.id' <<<"$run"); HCP_STATUS=$(jq -r '.attributes.status' <<<"$run")
                              case "$HCP_STATUS" in
                                applied|planned_and_finished) echo "HCP run $HCP_RUN: $HCP_STATUS"; exit 0 ;;
                                errored|discarded|canceled|force_canceled|policy_soft_failed)
                                  echo "HCP run $HCP_RUN: $HCP_STATUS - check it for ZONE_RESOURCE_POOL_EXHAUSTED (stockout)"; exit 1 ;;
                                planned|policy_checked|cost_estimated|post_plan_completed)
                                  echo "HCP run $HCP_RUN waits for confirmation - is auto-apply on for this workspace?" ;;
                              esac
                            fi
                            sleep 30
                          done
                          echo "timed out waiting for HCP (last: $HCP_RUN $HCP_STATUS)"; exit 1
                    environmentVariables:
                      - name: HCP_TOKEN
                        type: Secret
                        value: hcp_reservations_token
                    outputVariables:
                      - name: HCP_RUN
                        type: String
                        value: HCP_RUN
                      - name: HCP_STATUS
                        type: String
                        value: HCP_STATUS

              - step:
                  type: ServiceNowUpdate
                  name: CHG work note - implemented
                  identifier: chg_implemented
                  timeout: 5m
                  when:
                    stageStatus: Success
                    condition: <+execution.steps.find_pr.output.outputVariables.SKIP> == "false"
                  spec:
                    connectorRef: <servicenow_connector>
                    ticketType: change_request
                    ticketNumber: <+execution.steps.find_pr.output.outputVariables.CHG_NUMBER>
                    useServiceNowTemplate: false
                    fields:
                      - name: work_notes
                        value: "Implemented by Harness <+pipeline.executionId>: PR #<+execution.steps.find_pr.output.outputVariables.PR_NUMBER> merged as <+execution.steps.merge.output.outputVariables.MERGE_SHA>; HCP run <+execution.steps.wait_hcp.output.outputVariables.HCP_RUN> <+execution.steps.wait_hcp.output.outputVariables.HCP_STATUS>."

              - step:
                  type: ServiceNowUpdate
                  name: CHG work note - failed
                  identifier: chg_failed
                  timeout: 5m
                  when:
                    stageStatus: Failure
                    condition: <+execution.steps.find_pr.output.outputVariables.CHG_NUMBER> != ""
                  spec:
                    connectorRef: <servicenow_connector>
                    ticketType: change_request
                    ticketNumber: <+execution.steps.find_pr.output.outputVariables.CHG_NUMBER>
                    useServiceNowTemplate: false
                    fields:
                      - name: work_notes
                        value: "FAILED in Harness <+pipeline.executionId> - see the execution log. Back-out not needed if nothing merged; a failed HCP apply leaves the old reservation in place. The next sizer run shows PENDING_APPLY with a step-back value."

  notificationRules:
    - name: merge failed
      identifier: merge_failed
      pipelineEvents:
        - type: PipelineFailed
      notificationMethod:
        type: Slack                   # or MsTeams / Email / PagerDuty
        spec:
          userGroups: []
          webhookUrl: <+secrets.getValue("platform_oncall_slack_webhook")>
      enabled: true
