# Nightly trigger for ONE prod cluster - copy per cluster (ew2 and ew1).
# 22:05 Europe/London: 5 minutes inside the CHG window, DST handled by the timezone field.
# Emergency (stockout under an emergency CHG): run the pipeline manually with the same inputs;
# the ServiceNow step then checks the emergency CHG's state and window instead.
trigger:
  name: reservation-merge-<cluster>
  identifier: reservation_merge_<cluster>
  enabled: true
  orgIdentifier: <org>
  projectIdentifier: <project>
  pipelineIdentifier: reservation_merge
  source:
    type: Scheduled
    spec:
      type: Cron
      spec:
        type: UNIX
        expression: "5 22 * * *"
        timezone: Europe/London
  inputYaml: |
    pipeline:
      identifier: reservation_merge
      variables:
        - name: env_name
          type: String
          value: prd
        - name: cluster_name
          type: String
          value: <cluster>
        - name: github_repo
          type: String
          value: <org>/<infra-repo>
        - name: github_api
          type: String
          value: https://api.github.com
        - name: hcp_workspace_id
          type: String
          value: <ws-id of the reservations workspace for this region>
        - name: hcp_api
          type: String
          value: https://app.terraform.io/api/v2
        - name: servicenow_url
          type: String
          value: https://<instance>.service-now.com
